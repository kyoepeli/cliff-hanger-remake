<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cliff Hanger Remake — dev build</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; touch-action: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      .hud { position: fixed; font-family: ui-monospace, Menlo, monospace; color: #fbe9c8;
             text-shadow: 1px 1px 0 #000; pointer-events: none; user-select: none; }
      #hud-take { top: 12px; left: 14px; font-size: 15px; }
      #hud-status { top: 12px; right: 14px; font-size: 13px; text-align: right; max-width: 60vw; }
      #meter { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); width: min(340px, 80vw);
               font-family: ui-monospace, Menlo, monospace; color: #fbe9c8; text-align: center; font-size: 13px;
               pointer-events: none; }
      #meter[hidden] { display: none; }
      #meter-bar { position: relative; height: 22px; margin-top: 4px; background: #3a2415;
                   border: 2px solid #fbe9c8; border-radius: 4px; }
      #meter-marker { position: absolute; top: -6px; width: 6px; height: 32px; background: #e4472f;
                      border-radius: 2px; transform: translateX(-3px); }
      #banner { position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%);
                font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: clamp(24px, 6vw, 56px);
                color: #fff6e0; padding: 10px 26px; border-radius: 8px; pointer-events: none; opacity: 0;
                transition: opacity 0.15s; }
      #banner.show { opacity: 1; }
      #banner.hit { background: #2f6b4f; }
      #banner.miss { background: #c0392b; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="hud-take">TAKE 1</div>
    <div class="hud" id="hud-status">loading…</div>
    <div id="meter" hidden><div id="meter-label">FORCE</div><div id="meter-bar"><div id="meter-marker"></div></div></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
